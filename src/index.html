<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cotizador GoLease</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cotizador de arrendamiento vehicular GoLease — genera cotizaciones profesionales en PDF en segundos.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://bcsvqvibccfnsmagwkbr.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://bcsvqvibccfnsmagwkbr.supabase.co">
  <script>
    // Aplica el tema antes de que Angular renderice para evitar el "flash" de tema incorrecto.
    (function () {
      try {
        var t = localStorage.getItem('cotizador-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
