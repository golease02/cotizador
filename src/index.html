<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cotizador GoLease</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cotizador de arrendamiento vehicular GoLease — genera cotizaciones profesionales en PDF en segundos.">
  <meta name="theme-color" content="#234459">
  <!-- Miniatura / favicon: marca "go" adaptada para tamaños pequeños de pestaña.
       El ?v=2 fuerza a los navegadores a recargar el ícono (cambiar si se reemplazan los archivos). -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <!-- Open Graph: miniatura al compartir el enlace (WhatsApp, Facebook, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GoLease MX">
  <meta property="og:title" content="Cotizador GoLease">
  <meta property="og:description" content="Cotizador de arrendamiento vehicular GoLease — genera cotizaciones profesionales en PDF en segundos.">

  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://bcsvqvibccfnsmagwkbr.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://bcsvqvibccfnsmagwkbr.supabase.co">
  <script>
    // Aplica el tema antes de que Angular renderice para evitar el "flash" de tema incorrecto.
    (function () {
      try {
        var t = localStorage.getItem('cotizador-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>

</body>
