<div class="form-container">
    <div class="page-header">
        <h2>{{ isEditMode ? 'Editar Vendedor' : 'Nuevo Vendedor' }}</h2>
        <a routerLink="/admin/sellers" class="btn-secondary">← Volver</a>
    </div>

    <!-- Mensajes -->
    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <div *ngIf="loading" class="loading">Cargando...</div>

    <form (ngSubmit)="onSubmit()" *ngIf="!loading">
        <div class="form-group">
            <label>Número de Vendedor *</label>
            <input type="text" [(ngModel)]="seller.seller_number" name="seller_number" required [disabled]="isEditMode"
                placeholder="Ej. 001" />
        </div>

        <div class="form-group">
            <label>Nombre Completo *</label>
            <input type="text" [(ngModel)]="seller.full_name" name="full_name" required placeholder="Juan Pérez" />
        </div>

        <div class="form-group" *ngIf="!isEditMode">
            <label>Contraseña *</label>
            <input type="password" [(ngModel)]="seller.password" name="password" required
                placeholder="Mínimo 6 caracteres" />
        </div>

        <div class="form-group" *ngIf="isEditMode">
            <label>Correo</label>
            <input type="email" [(ngModel)]="seller.email" name="email" disabled />
        </div>

        <div class="form-group">
            <label>Agencia (Marca) *</label>
            <select [(ngModel)]="seller.agency_brand" name="agency_brand" required>
                <option value="">Selecciona una marca</option>
                <option *ngFor="let brand of brands" [value]="brand">{{ brand }}</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ubicación de Sucursal *</label>
            <select [(ngModel)]="seller.agency_location" name="agency_location" required>
                <option value="">Selecciona una ubicación</option>
                <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
            </select>
        </div>

        <div class="form-group" *ngIf="isEditMode">
            <label>Estado</label>
            <select [(ngModel)]="seller.active" name="active">
                <option [value]="true">Activo</option>
                <option [value]="false">Inactivo</option>
            </select>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
            {{ isEditMode ? 'Actualizar Vendedor' : 'Crear Vendedor' }}
        </button>
    </form>
</div>
