<div class="cotizador-wrapper">
    <!-- Barra superior con botón de regreso y vigencia -->
    <div class="cotizador-topbar">
        <a routerLink="/" class="btn-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            Volver a Mis Cotizaciones
        </a>
        <div class="topbar-right">
            <div class="meta-badge">
                <span class="pulse-dot"></span>
                <span>Vigencia 7 días</span>
            </div>
        </div>
    </div>

    <div class="cotizador-grid">
        <div class="left-column">
            <app-quote-form (quoteChange)="onQuoteInputChange($event)" (newQuote)="resetQuoteId()" />
        </div>
        <div class="right-column">
            <app-quote-options [calculation]="calculationResult()" (optionSelected)="onOptionSelected($event)" />
            <app-quote-breakdown *ngIf="calculationResult()" [calculation]="calculationResult()"
                (saveQuote)="onSaveQuote()" />
        </div>
    </div>
</div>
<div *ngIf="notificationMessage()" class="toast">{{ notificationMessage() }}</div>
