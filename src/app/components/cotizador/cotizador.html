<div class="cotizador-wrapper">
    <!-- Barra superior con botón de regreso y vigencia -->
    <div class="cotizador-topbar">
        <a routerLink="/" class="btn-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            Volver a Mis Cotizaciones
        </a>
        <div class="topbar-right">
            <div class="meta-badge" [class.badge-vencida]="isVencida()">
                <span class="pulse-dot" *ngIf="!isVencida()"></span>
                <span>{{ vigenciaLabel() }}</span>
            </div>
            <div class="save-indicator" *ngIf="saveState() === 'saving' || saveState() === 'saved'">
                <span class="save-dot" [class.is-saving]="saveState() === 'saving'"></span>
                <span>{{ saveIndicatorLabel() }}</span>
            </div>
        </div>
    </div>

    <div class="cotizador-grid">
        <div class="left-column">
            <app-quote-form [initialInput]="preloadedInput" (quoteChange)="onQuoteInputChange($event)" />
        </div>
        <div class="right-column">
            <div class="seller-commission-card" *ngIf="calculationResult()">
                <div class="commission-header">
                    <span class="commission-icon">💰</span>
                    <span class="commission-label">Comisión del vendedor</span>
                </div>
                <div class="commission-amount">{{ sellerCommission | currency:'MXN':'symbol':'1.2-2' }}</div>
                <div class="commission-formula">(Precio sin IVA − rentas adelantadas) × 4%</div>
            </div>
            <app-quote-breakdown *ngIf="calculationResult()" [calculation]="calculationResult()"
                (saveQuote)="onSaveQuote()" />
        </div>
    </div>
</div>
