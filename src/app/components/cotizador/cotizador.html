<div class="cotizador-wrapper">
  <!-- Barra superior con botón de regreso y vigencia -->
  <div class="cotizador-topbar">
    <a routerLink="/" class="btn-back">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 18 9 12 15 6" />
      </svg>
      Volver a Mis Cotizaciones
    </a>
    <div class="topbar-right">
      <div class="meta-badge" [class.badge-vencida]="isVencida()">
        <span class="pulse-dot" *ngIf="!isVencida()"></span>
        <span>{{ vigenciaLabel() }}</span>
      </div>
      <div
        class="save-indicator"
        *ngIf="saveState() === 'saving' || saveState() === 'saved'"
        [class.saving]="saveState() === 'saving'"
      >
        <span class="save-dot" [class.is-saving]="saveState() === 'saving'"></span>
        <span>{{ saveIndicatorLabel() }}</span>
      </div>
    </div>
  </div>

  <div class="cotizador-grid">
    <div class="left-column">
      <app-quote-form [initialInput]="preloadedInput" (quoteChange)="onQuoteInputChange($event)" />
      <!-- Banda de comisión del vendedor: al pie del formulario, para que
                 el vendedor vea su ganancia justo al terminar de capturar. -->
      <div class="seller-commission-banner" *ngIf="calculationResult()">
        <div class="commission-info">
          <span class="commission-kicker">Tu comisión por esta cotización</span>
          <span class="commission-amount">{{
            sellerCommission | currency: 'MXN' : 'symbol' : '1.2-2'
          }}</span>
        </div>
        <svg
          class="commission-badge"
          width="42"
          height="42"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="19" y1="5" x2="5" y2="19" />
          <circle cx="6.5" cy="6.5" r="2.5" />
          <circle cx="17.5" cy="17.5" r="2.5" />
        </svg>
      </div>
    </div>
    <div class="right-column">
      <app-quote-breakdown
        *ngIf="calculationResult()"
        [calculation]="calculationResult()"
        (saveQuote)="onSaveQuote()"
      />
    </div>
  </div>
</div>
