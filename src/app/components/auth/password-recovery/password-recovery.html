<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Recuperar contraseña</h2>
            <p>Ingresa tu número y un correo al que tengas acceso.</p>
        </div>

        <form *ngIf="!submitted" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="recovery-phone">Número de celular</label>
                <input id="recovery-phone" type="text" [(ngModel)]="phoneNumber" name="phoneNumber"
                    inputmode="numeric" maxlength="10" required placeholder="Ej. 5512345678" />
            </div>
            <div class="form-group">
                <label for="recovery-email">Correo de recuperación</label>
                <input id="recovery-email" type="email" [(ngModel)]="recoveryEmail" name="recoveryEmail"
                    autocomplete="email" required placeholder="nombre@dominio.com" />
            </div>
            <button type="submit" class="btn-primary" [disabled]="loading">
                {{ loading ? 'Enviando...' : 'Enviar enlace' }}
            </button>
        </form>

        <p *ngIf="submitted" class="success">
            Si los datos son válidos, recibirás un enlace para cambiar tu contraseña. Revisa tu correo.
        </p>
        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
        <p class="auth-link"><a routerLink="/login">Volver al inicio de sesión</a></p>
    </div>
</div>
