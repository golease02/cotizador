<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Nueva contraseña</h2>
            <p>Define una contraseña nueva para tu cuenta.</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="new-password">Nueva contraseña</label>
                <input id="new-password" type="password" [(ngModel)]="password" name="password"
                    autocomplete="new-password" minlength="6" required />
            </div>
            <div class="form-group">
                <label for="password-confirmation">Confirmar contraseña</label>
                <input id="password-confirmation" type="password" [(ngModel)]="confirmation" name="confirmation"
                    autocomplete="new-password" minlength="6" required />
            </div>
            <button type="submit" class="btn-primary" [disabled]="loading">Actualizar contraseña</button>
        </form>

        <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    </div>
</div>
