<div class="auth-container">
    <div class="auth-card register-card">
        <div class="auth-header">
            <h2>Registrarse</h2>
            <p>Ingresa tus datos para comenzar a cotizar</p>
        </div>

        <form (ngSubmit)="onRegister()">
            <!-- Número de celular -->
            <div class="form-group">
                <label>Número de celular *</label>
                <input type="text" [(ngModel)]="phoneNumber" name="phoneNumber" required placeholder="Ej. 5512345678" />
            </div>

            <!-- Nombre completo -->
            <div class="form-group">
                <label>Nombre Completo *</label>
                <input type="text" [(ngModel)]="fullName" name="fullName" required placeholder="Juan Pérez" />
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label>Contraseña *</label>
                <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
            </div>

            <!-- Marca -->
            <div class="form-group">
                <label>Marca (Agencia) *</label>
                <select [(ngModel)]="agencyBrand" name="agencyBrand" required>
                    <option value="">Selecciona una marca</option>
                    <option *ngFor="let brand of brands" [value]="brand">{{ brand }}</option>
                    <option value="Otro">Otro</option>
                </select>
                <input *ngIf="agencyBrand === 'Otro'" type="text" [(ngModel)]="otherBrand"
                    placeholder="Escribe la marca" name="otherBrand" style="margin-top: 0.5rem;" />
            </div>

            <!-- Mapa -->
            <div class="form-group">
                <label>Ubicación de Sucursal *</label>
                <div #mapContainer class="map-container"></div>
                <div *ngIf="selectedCoords" class="coords-info">
                    <span class="coord-label">📍 Dirección:</span>
                    <span class="coord-value">{{ addressText || 'Cargando dirección...' }}</span>
                </div>
                <p class="map-hint">Haz clic en el mapa para marcar la ubicación exacta de tu sucursal</p>
            </div>

            <!-- Buscador de direcciones (como Google Maps) -->
            <div class="form-group">
                <label>Buscar sucursal en el mapa</label>
                <div class="search-group">
                    <input type="text" [(ngModel)]="manualAddress" name="manualAddress"
                        placeholder="Ej. Toyota Querétaro" (keydown)="onSearchKeydown($event)" class="search-input" />
                    <button type="button" class="btn-search" (click)="searchLocation()" [disabled]="isSearching">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        {{ isSearching ? 'Buscando...' : 'Buscar' }}
                    </button>
                </div>
                <p class="map-hint">Escribe una dirección y presiona Enter o haz clic en "Buscar"</p>
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <p class="auth-link">
            ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    </div>
</div>
