<div class="app-layout">
  <app-header></app-header>

  <main class="main-content">
    <div class="container">
      
      <!-- Notification Toast -->
      <div *ngIf="notificationMessage()" class="toast-notification">
        <span>{{ notificationMessage() }}</span>
      </div>

      <div class="cotizador-grid">
        <!-- Left Column: Input Form -->
        <aside class="sidebar-col">
          <app-quote-form (quoteChange)="onQuoteInputChange($event)"></app-quote-form>
        </aside>

        <!-- Right Column: Results & Options -->
        <section class="results-col">
          <app-quote-options 
            [calculation]="calculationResult()" 
            [selectedOptionKey]="selectedOptionKey()"
            (optionSelected)="onOptionSelected($event)"
          ></app-quote-options>

          <app-quote-breakdown 
            [calculation]="calculationResult()" 
            [selectedOptionKey]="selectedOptionKey()"
            (saveQuote)="onSaveQuote()"
          ></app-quote-breakdown>
        </section>
      </div>

    </div>
  </main>
</div>
